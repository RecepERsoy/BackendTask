services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password!123
      - MSSQL_SA_PASSWORD=Password!123
    ports:
      - "1433:1433"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-api:
    build:
      context: .
      dockerfile: Auth.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AuthDb;User Id=sa;Password=Password!123;TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "5001:8080"
    depends_on:
      - sqlserver

  product-api:
    build:
      context: .
      dockerfile: Product.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ProductDb;User Id=sa;Password=Password!123;TrustServerCertificate=True
      - RedisCacheSettings__ConnectionString=redis:6379
      - RabbitMQ__Host=rabbitmq
      - MT_RABBITMQ_HOST=rabbitmq
    ports:
      - "5002:8080"
    depends_on:
      - sqlserver
      - redis
      - rabbitmq

  log-api:
    build:
      context: .
      dockerfile: Log.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - MT_RABBITMQ_HOST=rabbitmq
    ports:
      - "5003:8080"
    depends_on:
      - rabbitmq