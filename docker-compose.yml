version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: task_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: task_redis
    ports:
      - "6379:6379"
    restart: unless-stopped